<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The BLABS Live</title>

<style>
*{box-sizing:border-box}

html,body{
	margin:0;
	height:100%;
	background:#0d0d0d;
	color:#ddd;
	font-family:Arial,sans-serif;
}

body{overflow:hidden}

.layout{
	display:grid;
	grid-template-columns:minmax(0,1fr) 340px;
	gap:12px;
	max-width:1400px;
	height:100vh;
	margin:auto;
	padding:12px;
}

.video{
	min-width:0;
}

.player{
	position:relative;
	background:#000;
	aspect-ratio:16/9;
	overflow:hidden;
}

video{
	width:100%;
	height:100%;
	display:block;
	background:#000;
	object-fit:contain;
}

.start{
	position:absolute;
	inset:0;
	border:0;
	background:#000;
	color:#ddd;
	display:flex;
	flex-direction:column;
	align-items:center;
	justify-content:center;
	gap:10px;
	cursor:pointer;
	font:inherit;
}

.start.hidden{display:none}

.start svg{
	width:64px;
	height:64px;
	fill:#ddd;
}

.fs{
	position:absolute;
	right:8px;
	bottom:8px;
	width:38px;
	height:38px;
	border:0;
	background:#111b;
	color:#fff;
	cursor:pointer;
}

.fs svg{
	width:20px;
	height:20px;
	fill:currentColor;
}

.controls{
	display:flex;
	align-items:center;
	gap:10px;
	margin-top:8px;
	padding:8px;
	background:#151515;
	border:1px solid #282828;
}

.controls label{
	font-size:12px;
	color:#888;
}

.controls input{
	flex:1;
}

.controls button,
.chat-form button{
	border:0;
	background:#4169e1;
	color:white;
	padding:8px 12px;
	cursor:pointer;
}

.status{
	margin-top:7px;
	text-align:center;
	color:#777;
	font-size:13px;
}

.status.hidden{display:none}

.chat{
	display:flex;
	flex-direction:column;
	min-height:0;
	overflow:hidden;
	background:#151515;
	border:1px solid #282828;
}

.chat-header{
	padding:10px 12px;
	border-bottom:1px solid #282828;
	font-size:13px;
	display:flex;
	justify-content:space-between;
}

.chat-state{
	color:#666;
	font-size:11px;
}

.dot{
	display:inline-block;
	width:7px;
	height:7px;
	margin-right:5px;
	border-radius:50%;
	background:#444;
}

.dot.online{background:#22c55e}

.messages{
	flex:1;
	min-height:0;
	overflow-y:auto;
	padding:10px 12px;
	font-size:14px;
	line-height:1.4;
}

.line{
	margin-bottom:6px;
	word-break:break-word;
}

.nick{
	color:#4d6bfe;
	font-weight:bold;
}

.nick:after{
	content:":";
	color:#555;
	margin-right:4px;
}

.time{
	color:#555;
	font-size:11px;
	margin-left:6px;
}

.system{
	color:#666;
	font-size:12px;
	font-style:italic;
}

.chat-form{
	display:flex;
	gap:5px;
	padding:8px;
	border-top:1px solid #282828;
	background:#111;
}

.chat-form input{
	min-width:0;
	border:1px solid #333;
	background:#1c1c1c;
	color:#ddd;
	padding:8px;
	font:inherit;
}

.chat-form .name{
	width:70px;
}

.chat-form .message{
	flex:1;
}

@media(max-width:900px){
	body{overflow:auto}

	.layout{
		display:flex;
		flex-direction:column;
		height:auto;
		min-height:100vh;
	}

	.chat{
		height:400px;
	}
}
</style>
</head>

<body>

<div class="layout">

	<div class="video">
		<div class="player">

			<video id="video" playsinline preload="none" muted></video>

			<button class="start" id="start">
				<svg viewBox="0 0 24 24">
					<path d="M8 5v14l11-7z"/>
				</svg>
				<span>Tap to play live</span>
			</button>

			<button class="fs" id="fs" title="Fullscreen">
				<svg id="fsIcon" viewBox="0 0 24 24">
					<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
				</svg>
			</button>

		</div>

		<div class="controls">
			<button id="sound" hidden>Enable sound</button>
			<label for="volume">Volume</label>
			<input id="volume" type="range" min="0" max="100" value="100">
		</div>

		<div id="status" class="status"></div>
	</div>

	<div class="chat">

		<div class="chat-header">
			<span>Chat</span>
			<span class="chat-state">
				<span class="dot" id="dot"></span>
				<span id="chatStatus">connecting</span>
			</span>
		</div>

		<div class="messages" id="messages"></div>

		<form class="chat-form" id="chatForm">
			<input
				class="name"
				id="nick"
				type="text"
				placeholder="nick"
				maxlength="20"
			>

			<input
				class="message"
				id="message"
				type="text"
				placeholder="message"
				maxlength="300"
				disabled
			>

			<button id="send" disabled>Send</button>
		</form>

	</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js/dist/hls.min.js"></script>

<script>
const STREAM = 'https://rtmp.br3xality.org/live/index.m3u8';
const CHAT = 'wss://chat.br3xality.org/';

const video = document.getElementById('video');
const start = document.getElementById('start');
const fs = document.getElementById('fs');
const fsIcon = document.getElementById('fsIcon');
const sound = document.getElementById('sound');
const volume = document.getElementById('volume');
const status = document.getElementById('status');

const messages = document.getElementById('messages');
const chatForm = document.getElementById('chatForm');
const nick = document.getElementById('nick');
const message = document.getElementById('message');
const send = document.getElementById('send');
const dot = document.getElementById('dot');
const chatStatus = document.getElementById('chatStatus');

let hls;
let started = false;
let ws;
let reconnect = 1000;
let reconnectTimer;

video.volume = 1;
video.muted = true;

function playVideo(){
	video.play().catch(function(){
		status.textContent = 'Tap again to start.';
		status.classList.remove('hidden');
	});
}

function fullscreen(){
	if(document.fullscreenElement){
		document.exitFullscreen();
	}else{
		video.requestFullscreen?.();
	}
}

fs.onclick = fullscreen;

document.onfullscreenchange = function(){
	const path = document.querySelector('#fsIcon path');

	if(document.fullscreenElement){
		path.setAttribute('d','M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z');
	}else{
		path.setAttribute('d','M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z');
	}
};

volume.oninput = function(){
	video.volume = volume.value / 100;
};

function startVideo(){
	if(started) return;

	started = true;
	start.classList.add('hidden');
	status.textContent = 'Connecting...';

	video.muted = true;

	if(Hls.isSupported()){
		hls = new Hls({
			lowLatencyMode:true,
			liveSyncDurationCount:3,
			liveMaxLatencyDurationCount:6,
			maxLiveSyncPlaybackRate:1,
			backBufferLength:5,
			maxBufferLength:3,
			maxMaxBufferLength:6,
			enableWorker:true,
			startPosition:-1,
			liveDurationInfinity:false
		});

		hls.attachMedia(video);

		hls.on(Hls.Events.MEDIA_ATTACHED,function(){
			hls.loadSource(STREAM);
		});

		hls.on(Hls.Events.MANIFEST_PARSED,function(){
			sound.hidden = false;
			status.classList.add('hidden');
			playVideo();
		});

		hls.on(Hls.Events.ERROR,function(_,data){
			if(!data.fatal) return;

			if(data.type === Hls.ErrorTypes.NETWORK_ERROR){
				status.textContent = 'Network error. Retrying...';
				hls.startLoad();
			}else if(data.type === Hls.ErrorTypes.MEDIA_ERROR){
				status.textContent = 'Media error. Recovering...';
				hls.recoverMediaError();
			}else{
				status.textContent = 'Playback failed.';
				hls.destroy();
			}
		});

	}else if(video.canPlayType('application/vnd.apple.mpegurl')){
		video.src = STREAM;

		video.onloadedmetadata = function(){
			sound.hidden = false;
			status.classList.add('hidden');
			playVideo();
		};
	}else{
		status.textContent = 'HLS is not supported in this browser.';
	}
}

start.onclick = startVideo;

sound.onclick = function(){
	video.volume = volume.value / 100;
	video.muted = false;
	playVideo();
	sound.hidden = true;
};

video.onclick = function(){
	if(!started){
		startVideo();
	}else if(video.paused){
		playVideo();
	}
};


/* chat */

try{
	nick.value = localStorage.getItem('chat_nick') || '';
}catch(e){}

function chatState(state){
	if(state === 'online'){
		dot.classList.add('online');
		chatStatus.textContent = 'online';
		message.disabled = false;
		send.disabled = false;
	}else if(state === 'connecting'){
		dot.classList.remove('online');
		chatStatus.textContent = 'connecting';
		message.disabled = true;
		send.disabled = true;
	}else{
		dot.classList.remove('online');
		chatStatus.textContent = 'offline';
		message.disabled = true;
		send.disabled = true;
	}
}

function addLine(el){
	const bottom =
		messages.scrollHeight -
		messages.scrollTop -
		messages.clientHeight < 40;

	messages.appendChild(el);

	while(messages.children.length > 200)
		messages.firstChild.remove();

	if(bottom)
		messages.scrollTop = messages.scrollHeight;
}

function system(text){
	const el = document.createElement('div');
	el.className = 'line system';
	el.textContent = text;
	addLine(el);
}

function msg(name,text,time){
	const el = document.createElement('div');
	el.className = 'line';

	el.innerHTML = '';

	const n = document.createElement('span');
	n.className = 'nick';
	n.textContent = name;

	const t = document.createElement('span');
	t.textContent = text;

	const ts = document.createElement('span');
	ts.className = 'time';
	ts.textContent = new Date(time).toLocaleTimeString([],{
		hour:'2-digit',
		minute:'2-digit'
	});

	el.append(n,t,ts);
	addLine(el);
}

function connect(){
	chatState('connecting');

	try{
		ws = new WebSocket(CHAT);
	}catch(e){
		retry();
		return;
	}

	ws.onopen = function(){
		reconnect = 1000;
		chatState('online');
		system('connected');
	};

	ws.onmessage = function(e){
		let data;

		try{
			data = JSON.parse(e.data);
		}catch(e){
			return;
		}

		if(!data || typeof data.type !== 'string') return;

		if(data.type === 'msg'){
			msg(
				String(data.nick || ''),
				String(data.text || ''),
				Number(data.ts) || Date.now()
			);
		}

		if(data.type === 'system'){
			system(String(data.text || ''));
		}
	};

	ws.onclose = function(){
		ws = null;
		chatState('offline');
		retry();
	};
}

function retry(){
	if(reconnectTimer) return;

	reconnectTimer = setTimeout(function(){
		reconnectTimer = null;
		connect();
	},reconnect);

	reconnect = Math.min(reconnect * 2,30000);
}

chatForm.onsubmit = function(e){
	e.preventDefault();

	if(!ws || ws.readyState !== WebSocket.OPEN) return;

	const name = nick.value.trim().slice(0,20);
	const text = message.value.trim().slice(0,300);

	if(!name){
		nick.focus();
		return;
	}

	if(!text) return;

	try{
		localStorage.setItem('chat_nick',name);
	}catch(e){}

	ws.send(JSON.stringify({
		type:'msg',
		nick:name,
		text:text
	}));

	message.value = '';
	message.focus();
};

connect();
</script>

</body>
</html>
