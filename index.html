<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BR3XALITY debug</title>
<style>
  html, body { margin: 0; background: #0d0d0d; color: #eee; font: 13px system-ui; }
  video { width: 100%; background: #000; display: block; }
  #hud {
    font: 11px ui-monospace, monospace;
    white-space: pre;
    padding: 8px 10px;
    background: #111;
    color: #9ae6a0;
    border-top: 1px solid #222;
    line-height: 1.45;
    max-height: 55vh;
    overflow: auto;
  }
  #hud .ev { color: #f5c96b; }
  #hud .warn { color: #ff7b7b; }
</style>
</head>
<body>
<video id="v" autoplay muted playsinline></video>
<div id="hud">booting...</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
var v = document.getElementById('v');
var hud = document.getElementById('hud');
var lines = [];
var t0 = performance.now();

function stamp() {
  return ((performance.now() - t0) / 1000).toFixed(2).padStart(7, ' ');
}
function log(cls, msg) {
  lines.push('<span class="' + cls + '">' + stamp() + ' ' + msg + '</span>');
  if (lines.length > 40) lines.shift();
  hud.innerHTML = lines.join('\n') + '\n\n' + stats();
}
function stats() {
  var b = v.buffered;
  var bufStr = b.length ? (b.start(0).toFixed(1) + '-' + b.end(b.length-1).toFixed(1)) : 'none';
  return [
    'paused=' + v.paused + '  muted=' + v.muted + '  ready=' + v.readyState,
    'cur=' + v.currentTime.toFixed(2) + '  rate=' + v.playbackRate,
    'buffered=' + bufStr + '  seeking=' + v.seeking,
    'networkState=' + v.networkState
  ].join('\n');
}

['loadstart','loadedmetadata','canplay','canplaythrough','play','playing',
 'pause','waiting','stalled','suspend','emptied','abort','error',
 'ratechange','seeking','seeked','progress','durationchange'].forEach(function (ev) {
  v.addEventListener(ev, function () { log('ev', ev); });
});
v.addEventListener('error', function () {
  var e = v.error;
  if (e) log('warn', 'ERR code=' + e.code + ' ' + (e.message || ''));
});

var lastPlayReject = '';
function tryPlay(tag) {
  var p = v.play();
  if (p && p.catch) p.catch(function (err) {
    lastPlayReject = tag + ' ' + err.name;
    log('warn', 'play() rejected: ' + err.name + ' ' + (err.message || ''));
  });
}

var unmuted = false;
function onTap() {
  if (!unmuted) {
    unmuted = true;
    v.muted = false;
    log('ev', 'user unmuted');
  }
  if (v.paused) tryPlay('tap');
}
v.addEventListener('click', onTap);
v.addEventListener('touchstart', onTap, { passive: true });

var hls = new Hls({
  lowLatencyMode: false,
  backBufferLength: 30,
  liveSyncDurationCount: 3,
  liveMaxLatencyDurationCount: 10,
  liveDurationInfinity: true,
  enableWorker: true,
  startPosition: -1
});
hls.loadSource('https://rtmp.br3xality.org/live/index.m3u8');
hls.attachMedia(v);

var LEVELINFO = '';
hls.on(Hls.Events.MANIFEST_PARSED, function (e, d) {
  var lv = d.levels && d.levels[0];
  if (lv) {
    LEVELINFO = 'seg~' + (lv.details ? '?' : '?');
  }
  log('ev', 'manifest parsed, levels=' + (d.levels ? d.levels.length : 0));
  tryPlay('manifest');
});

hls.on(Hls.Events.LEVEL_LOADED, function (e, d) {
  if (d.details) {
    log('ev', 'level loaded: targetdur=' + d.details.targetduration +
              ' frags=' + d.details.fragments.length);
  }
});

hls.on(Hls.Events.FRAG_LOADED, function (e, d) {
  log('ev', 'frag loaded: ' + (d.frag.sn) + ' dur=' + d.frag.duration.toFixed(2));
});

hls.on(Hls.Events.ERROR, function (e, d) {
  log('warn', 'hls ERR ' + d.type + ' ' + d.details + (d.fatal ? ' FATAL' : ''));
  if (!d.fatal) return;
  if (d.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
  else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
});

setInterval(function () { log('', 'tick'); }, 2000);
</script>
</body>
</html>
