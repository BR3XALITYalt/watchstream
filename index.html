<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BR3XALITY Live</title>
  <style>
    body {
      margin: 0;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .wrapper {
      width: 100%;
      max-width: 960px;
      padding: 16px;
    }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
    }
    .status {
      color: #888;
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <video id="video" autoplay muted playsinline></video>
    <div class="status" id="status">Connecting...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const streamUrl = 'https://rtmp.br3xality.org/live/index.m3u8';

    // Max allowed distance behind the live edge before we snap forward, in seconds.
    const MAX_DRIFT = 4;

    if (Hls.isSupported()) {
      const hls = new Hls({
        lowLatencyMode: true,
        backBufferLength: 10,
        liveSyncDurationCount: 1,
        liveMaxLatencyDurationCount: 3,
        liveDurationInfinity: true,
        maxLiveSyncPlaybackRate: 1.5,
        startPosition: -1
      });

      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        status.textContent = 'Live';
        video.play().catch(function () {
          status.textContent = 'Autoplay blocked. Click the page to start.';
        });
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              status.textContent = 'Network error. Retrying...';
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              status.textContent = 'Media error. Recovering...';
              hls.recoverMediaError();
              break;
            default:
              status.textContent = 'Playback failed. Check the stream URL.';
              hls.destroy();
              break;
          }
        }
      });

      // Drift correction: every few seconds, check how far behind the
      // live edge playback has fallen. If it exceeds MAX_DRIFT, snap forward.
      setInterval(function () {
        if (!hls.latency) return;
        if (video.paused) return;
        if (hls.latency > MAX_DRIFT) {
          const target = hls.liveSyncPosition;
          if (typeof target === 'number' && isFinite(target)) {
            video.currentTime = target;
          }
        }
      }, 3000);

      // If playback stalls (buffer underrun), retry from the live edge.
      video.addEventListener('waiting', function () {
        setTimeout(function () {
          if (video.readyState < 3 && !video.paused) {
            const target = hls.liveSyncPosition;
            if (typeof target === 'number' && isFinite(target)) {
              video.currentTime = target;
            }
          }
        }, 1500);
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // Safari native HLS. It handles live edge on its own, mostly.
      video.src = streamUrl;
      status.textContent = 'Live';
    } else {
      status.textContent = 'HLS is not supported in this browser.';
    }
  </script>
</body>
</html>
