      padding: 16px;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
    }
    @media (max-width: 900px) {

        padding: 12px;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
      }
    }

      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    .player {
      position: relative;
      line-height: 0;
      flex: 0 0 auto;
    }
    video {
      width: 100%;
      background: #000;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }
    video:fullscreen {
      border-radius: 0;
      object-fit: contain;
    }
    .fs-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease;
    }
    .fs-btn:hover { background: rgba(0, 0, 0, 0.8); }
    .fs-btn:focus-visible {
      outline: 2px solid #4d6bfe;
      outline-offset: 2px;
    }
    .fs-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      pointer-events: none;
    }
    .status {
      color: #888;
      font-size: 14px;
      margin-top: 8px;
      text-align: center;
      line-height: 1.4;
    }
    .status.hidden { display: none; }

    .chat {
      background: #151515;
      border: 1px solid #262626;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #262626;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e5e5e5;
      flex: 0 0 auto;
    }
    .chat-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 400;
      color: #666;
    }
    .chat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background 0.2s ease;
    }
    .chat-dot.online { background: #22c55e; }
    .chat-messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      color: #d4d4d4;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-track { background: #151515; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: #2e2e2e;
      border-radius: 4px;
    }
    .chat-line {
      margin: 0 0 6px;
      line-height: 1.5;
    }
    .chat-line .nick {
      color: #4d6bfe;
      font-weight: 600;
      margin-right: 4px;
    }
    .chat-line .nick::after {
      content: ":";
      color: #555;
      margin-left: 1px;
      font-weight: 400;
    }
    .chat-line .ts {
      color: #4a4a4a;
      font-size: 11px;
      margin-left: 6px;
    }
    .chat-line.system {
      color: #666;
      font-style: italic;
      font-size: 12px;
    }
    .chat-form {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #262626;
      background: #121212;
      flex: 0 0 auto;
    }
    .chat-form input {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 6px;
      padding: 8px 10px;
      color: #e5e5e5;
      font-size: 14px;
      font-family: inherit;
      min-width: 0;
    }
    .chat-form input:focus {
      outline: none;
      border-color: #4d6bfe;
    }
    .chat-form input.nick { flex: 0 0 72px; }
    .chat-form input.msg { flex: 1; }
    .chat-form button {
      background: #4d6bfe;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .chat-form button:hover { background: #3a55e0; }
    .chat-form button:disabled {
      background: #262626;
      color: #555;
      cursor: not-allowed;
    }
    .chat-form button:focus-visible {
      outline: 2px solid #4d6bfe;
      outline-offset: 2px;
